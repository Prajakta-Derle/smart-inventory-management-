# Render Blueprint for the Smart Inventory backend (Spring Boot).
# In Render: New → Blueprint → connect this repo. It reads this file.
# You still set the secret env vars (DB_*, JWT_SECRET, CORS_ALLOWED_ORIGIN)
# in the Render dashboard after the service is created.
services:
  - type: web
    name: smart-inventory-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api-docs
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_EXPIRATION_MINUTES
        value: 60
      # Set these in the Render dashboard (marked sync:false so they are not
      # committed to the repo):
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
