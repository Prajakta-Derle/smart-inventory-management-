# ── Test datasource: H2 in-memory replacing MySQL ────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA: create schema from entities, drop after test ────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ── JWT test stub (not used in production) ───────────────────────────────────
app.jwt.secret=test-secret-key-minimum-256-bits-long-for-hs256-algorithm-scaffold-only
app.jwt.expiration-minutes=60

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origin=http://localhost:5173

# ── OpenAI stub ──────────────────────────────────────────────────────────────
app.openai.api-key=
