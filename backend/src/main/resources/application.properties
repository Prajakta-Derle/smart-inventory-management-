# ============================================================
# Application
# ============================================================
spring.application.name=smart-inventory-management

# Server port — defaults to 8080 locally; hosting platforms (e.g. Render)
# inject their own port via the PORT environment variable.
server.port=${PORT:8080}

# ============================================================
# DataSource — all values supplied via environment variables
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Connection pool — kept small for free-tier databases that cap the
# number of concurrent connections (e.g. Clever Cloud free = 5).
# ============================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000

# ============================================================
# JWT — all values supplied via environment variables
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ============================================================
# CORS — frontend origin supplied via environment variable
# ============================================================
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ============================================================
# OpenAI — key supplied via environment variable (never hardcoded)
# ============================================================
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
